[paths]
raw_data_dir = data/raw
interim_data_dir = data/interim
processed_data_dir = data/processed
models_dir = models
logs_dir = logs

[pipeline]
# reference date for Recency calculation. "auto" = max order date in data + 1 day
reference_date = auto

[segmentation]
n_clusters = 4
random_state = 42
kmeans_n_init = 10

[order_filter]
# only orders with this status are considered "real" completed purchases for RFM
valid_status = delivered
